services:
  # Each service reads the committed example first and its local .env last, so a value lives in one
  # place: the example carries the defaults of the compose network, the local file only what differs
  # on this machine. The same pair feeds the Makefiles, so `make run` and the container agree.
  cabby-gateway:
    build:
      context: .
      dockerfile: backend/cabby-gateway/Dockerfile
    env_file:
      - path: ./backend/cabby-gateway/.env
        required: false
    ports:
      - "127.0.0.1:${CABBY_GATEWAY_PORT:?Set CABBY_GATEWAY_PORT in backend/cabby-gateway/.env.example}:${CABBY_GATEWAY_PORT:?Set CABBY_GATEWAY_PORT in backend/cabby-gateway/.env.example}"
    stop_grace_period: 10s

  auth:
    build:
      context: .
      dockerfile: backend/auth/Dockerfile
    env_file:
      - path: ./backend/auth/.env.example
      - path: ./backend/auth/.env
        required: false
    depends_on:
      - postgres
    # 9093 gRPC and 9094 metrics stay inside the compose network: neither is
    # published to the host (R-05, R-11).
    expose:
      - "9093"
      - "9094"
    stop_grace_period: 10s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_DB: auth
      POSTGRES_PASSWORD: ${CABBY_AUTH_DB_PASSWORD:?Set CABBY_AUTH_DB_PASSWORD in backend/auth/.env.example}
    volumes:
      - auth-data:/var/lib/postgresql

  prometheus:
    image: prom/prometheus:v3.14.0
    depends_on:
      - cabby-gateway
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.2
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/monitoring/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  prometheus-data:
  grafana-data:
  auth-data:
