services:
  # Every service reads only its own local .env, copied from the committed .env.example: nothing here
  # refers to an example. The same files feed the ${...} interpolation below when compose is run
  # through the root Makefile.
  cabby-gateway:
    build:
      context: .
      dockerfile: backend/cabby-gateway/Dockerfile
    env_file:
      - ./backend/cabby-gateway/.env
    depends_on:
      - auth
      - location
    ports:
      - "127.0.0.1:${CABBY_GATEWAY_PORT:-8080}:${CABBY_GATEWAY_PORT:-8080}"
    stop_grace_period: 10s

  auth:
    build:
      context: .
      dockerfile: backend/auth/Dockerfile
    env_file:
      - ./backend/auth/.env
    depends_on:
      - auth-db
    # 9093 gRPC and 9094 metrics stay inside the compose network: neither is
    # published to the host (R-05, R-11).
    expose:
      - "9093"
      - "9094"
    stop_grace_period: 10s

  auth-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_DB: auth
      POSTGRES_PASSWORD: ${CABBY_AUTH_DB_PASSWORD}
    volumes:
      - auth-data:/var/lib/postgresql

  location:
    build:
      context: .
      dockerfile: backend/location/Dockerfile
    env_file:
      - ./backend/location/.env
    depends_on:
      - location-db
    # 9095 gRPC and 9096 metrics stay inside the compose network: neither is published to the host.
    expose:
      - "9095"
      - "9096"
    stop_grace_period: 10s

  # The records of location live in a database of their own, with their own volume and password:
  # the owner of the data is the service, and auth shares no storage with it (spec 004 plan.md).
  location-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: location
      POSTGRES_DB: location
      POSTGRES_PASSWORD: ${CABBY_LOCATION_DB_PASSWORD}
    volumes:
      - location-data:/var/lib/postgresql

  # Read-only viewer of the auth and location databases (specs/006-db-viewer). It reads the databases
  # directly, not through the gateway or the services, and is published on the loopback interface only.
  dbviewer:
    build:
      context: .
      dockerfile: backend/dbviewer/Dockerfile
    env_file:
      - ./backend/dbviewer/.env
    depends_on:
      - auth-db
      - location-db
    ports:
      - "127.0.0.1:${CABBY_DBVIEWER_HTTP_PORT:-8090}:${CABBY_DBVIEWER_HTTP_PORT:-8090}"
    stop_grace_period: 10s

  prometheus:
    image: prom/prometheus:v3.14.0
    depends_on:
      - cabby-gateway
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.2
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  prometheus-data:
  grafana-data:
  auth-data:
  location-data:
