global:
  scrape_interval: 15s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cabby-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - cabby-gateway:9091

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth:9094

  - job_name: location
    metrics_path: /metrics
    static_configs:
      - targets:
          - location:9096
